      strategy: deferred
      mirror_source_id: ""
      notes: "行业源：合规投递至 data/inbox"
    - name: 律所AI法律观察
      strategy: deferred
      mirror_source_id: ""
      notes: "实践源：人工精选后写入 inbox"

